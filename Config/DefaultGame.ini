MinJumpZVelocity=800.000000
bOnlyFixWhenLower=True

[/Script/sender.SenderFragmentSubsystem]
; 点 Play 后自动进入执行阶段（关闭后可自己在蓝图/UI 里调 Start Fragment Phase）
bAutoStartOnBeginPlay=True
; 执行前先把方块藏起来，执行时才出现
bHideBeforeStart=True
; 自动开始的延迟（秒）
StartDelay=0.100000
; 被玩家碰到时直接销毁方块；False = 只隐藏，方便 Reset Fragment Phase 重来
bDestroyOnTouch=False
; 只有玩家能触发消失（AI/僵尸碰不会带走）
bOnlyPlayerTriggers=True
; 目标方块 Tag（场景里 25 个 fragment 方块已打此 Tag）
BlockTag=Fragment
; Tag 找不到时的材质名兜底
MaterialKeyword=fragment

[/Script/sender.SenderSenseGateSubsystem]
; False = 踩上去一次后，本次游玩内一直消失；重新 Play 会恢复
bRestoreWhenReleased=False
